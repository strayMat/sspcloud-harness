<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SSPCloud Pi Harness</title>
<style>
  :root {
    --bg: #0f1117; --panel: #161a23; --border: #262c3a;
    --text: #e6e9ef; --muted: #8a93a6; --accent: #5b8cff;
    --user: #243b6b; --assistant: #1c2230; --code: #0c0f16;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header .brand { font-weight: 600; font-size: 15px; }
  header .brand span { color: var(--accent); }
  header .spacer { flex: 1; }
  select, button {
    background: #1f2532; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; display: inline-block; }
  .dot.on { background: #4caf50; }

  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 760px; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg .role { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.assistant { align-self: flex-start; background: var(--assistant); }
  .msg.system { align-self: center; background: transparent; color: var(--muted); font-size: 12px; }
  .msg pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; }
  .msg code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .tool { align-self: flex-start; font-size: 12px; color: var(--muted); background: #141925; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; max-width: 760px; }
  .tool .tname { color: var(--accent); font-weight: 600; }
  .msg.img { align-self: flex-start; background: var(--assistant); max-width: 480px; padding: 8px; }
  .msg.img img { display: block; max-width: 100%; max-height: 320px; border-radius: 8px; }

  #inputbar { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  #input {
    flex: 1; resize: none; background: #1f2532; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font-family: inherit; font-size: 14px; max-height: 160px;
  }
  #input:focus { outline: none; border-color: var(--accent); }

  /* Files panel */
  #files { border-top: 1px solid var(--border); background: var(--panel); max-height: 240px; overflow-y: auto; padding: 8px 16px; display: none; }
  #files.show { display: block; }
  #files .files-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  #files .files-head label { font-size: 12px; color: var(--muted); }
  #files .fileupload { cursor: pointer; background: #1f2532; border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: 12px; color: var(--text); }
  #files .fileupload:hover { border-color: var(--accent); }
  #files .sect { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 8px; }
  #files .row { display: flex; align-items: center; gap: 10px; padding: 3px 0; font-size: 13px; }
  #files .row .fname { flex: 1; }
  #files .row .fsize { color: var(--muted); font-size: 11px; }
  #files a { color: var(--accent); text-decoration: none; }

  /* Login overlay */
  #login-overlay { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; z-index: 10; }
  #login-overlay.show { display: flex; }
  #login-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px; width: 300px; }
  #login-box h2 { margin: 0 0 16px; font-size: 16px; }
  #login-box input { width: 100%; background: #1f2532; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 14px; margin-bottom: 10px; }
  #login-box input:focus { outline: none; border-color: var(--accent); }
  #login-err { font-size: 12px; color: #e5534b; min-height: 16px; }
</style>
</head>
<body>
  <header>
    <div class="brand">SSPCloud <span>Pi</span> Harness</div>
    <div class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></div>
    <div class="spacer"></div>
    <select id="project"></select>
    <button id="delproj" title="Delete active workspace (switches to default)">Delete</button>
    <button id="newproj" title="New project">+ New</button>
    <button id="filesbtn" title="Toggle files">Files</button>
  </header>

  <div id="files">
    <div class="files-head">
      <label>Files (active project)</label>
      <label class="fileupload"><input type="file" id="fileinput" multiple hidden />⬆ Upload</label>
    </div>
    <div id="files-list"></div>
  </div>
  <div id="chat"></div>

  <div id="inputbar">
    <textarea id="input" placeholder="Send a message…  (/stop aborts)  (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
    <button id="send" class="primary">Send</button>
  </div>

  <div id="login-overlay">
    <div id="login-box">
      <h2>SSPCloud <span style="color:var(--accent)">Pi</span> Harness</h2>
      <input type="password" id="login-pass" placeholder="Password" autocomplete="current-password" />
      <div id="login-err"></div>
      <button id="login-btn" class="primary">Login</button>
    </div>
  </div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const projectSel = document.getElementById('project');
const filesPanel = document.getElementById('files');
const statusEl = document.getElementById('status');
const dot = document.getElementById('dot');

let ws, currentProject = null, streaming = false;
const DEFAULT_PROJECT = 'default';

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderMd(t) {
  // Minimal markdown: code blocks + inline code + bold. Keep simple & safe.
  let s = escapeHtml(t);
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (m,lang,code)=>`<pre><code>${code.replace(/\n$/,'')}</code></pre>`);
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return s;
}

function addMsg(role, text, streaming=false) {
  const m = el('div', 'msg ' + role);
  m.appendChild(el('div', 'role', role === 'user' ? 'You' : (role === 'assistant' ? 'Pi' : 'System')));
  const body = el('div', 'body');
  body.innerHTML = renderMd(text);
  m.appendChild(body);
  chat.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
  return body;
}
function addTool(name, state) {
  const t = el('div', 'tool');
  t.innerHTML = `<span class="tname">${escapeHtml(name)}</span> · ${state}`;
  chat.appendChild(t);
  chat.scrollTop = chat.scrollHeight;
  return t;
}

// Render image content blocks (e.g. from pi's read tool) as data-URI <img>.
function addImages(blocks) {
  (blocks || []).filter(b => b.type === 'image' && b.data).forEach(b => {
    const m = el('div', 'msg img');
    const img = document.createElement('img');
    img.src = `data:${b.mimeType || 'image/*'};base64,${b.data}`;
    m.appendChild(img);
    chat.appendChild(m);
    chat.scrollTop = chat.scrollHeight;
  });
}
function imageBlocks(content) {
  return Array.isArray(content) ? content : [];
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) { showLogin(); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
}

const loginOverlay = document.getElementById('login-overlay');
let authChecked = false;

function showLogin() {
  loginOverlay.classList.add('show');
  document.getElementById('login-pass').focus();
}

async function tryLogin() {
  const pass = document.getElementById('login-pass').value;
  try {
    const r = await fetch('/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: pass }) });
    if (!r.ok) throw new Error('bad password');
    loginOverlay.classList.remove('show');
    document.getElementById('login-err').textContent = '';
    document.getElementById('login-pass').value = '';
    authChecked = true;
    connect();
  } catch (e) {
    document.getElementById('login-err').textContent = e.message;
  }
}

document.getElementById('login-btn').onclick = tryLogin;
document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

// Gate startup: if auth is on and we're not logged in, show the overlay.
async function init() {
  const d = await (await fetch('/auth/status')).json();
  if (d.enabled) { showLogin(); return; }
  authChecked = true;
  connect();
}
init();

async function loadProjects() {
  const d = await api('/api/projects');
  projectSel.innerHTML = '';
  d.projects.forEach(p => {
    const o = el('option', null, p.name + (p.active ? ' (active)' : ''));
    o.value = p.name;
    projectSel.appendChild(o);
  });
  if (d.active) { currentProject = d.active; projectSel.value = d.active; }
  statusEl.textContent = d.active ? `project: ${d.active}` : 'no project';
}

function loadFiles() {
  if (!currentProject) return;
  const filesList = document.getElementById('files-list');
  Promise.all([
    api(`/api/projects/${currentProject}/files?subdir=uploads`),
    api(`/api/projects/${currentProject}/files?subdir=downloads`),
  ]).then(([ups, downs]) => {
    let html = '';
    html += '<div class="sect">Uploads (you → pi)</div>';
    if (!ups.files.length) html += '<div class="row"><span class="fname" style="color:var(--muted)"> (none)</span></div>';
    ups.files.forEach(f => {
      const kb = (f.size/1024).toFixed(1);
      html += `<div class="row"><span class="fname">${escapeHtml(f.name)}</span><span class="fsize">${kb} KB</span>`
            + `<a href="/api/projects/${currentProject}/download/${f.path}" target="_blank">download</a></div>`;
    });
    html += '<div class="sect">Downloads (pi → you)</div>';
    if (!downs.files.length) html += '<div class="row"><span class="fname" style="color:var(--muted)"> (none)</span></div>';
    downs.files.forEach(f => {
      const kb = (f.size/1024).toFixed(1);
      html += `<div class="row"><span class="fname">${escapeHtml(f.name)}</span><span class="fsize">${kb} KB</span>`
            + `<a href="/api/projects/${currentProject}/download/${f.path}" target="_blank">download</a></div>`;
    });
    filesList.innerHTML = html;
  });
}

async function uploadFiles(files) {
  if (!currentProject || !files.length) return;
  addMsg('system', `uploading ${files.length} file(s) to ${currentProject}…`);
  for (const f of files) {
    const fd = new FormData();
    fd.append('file', f);
    try {
      await api(`/api/projects/${currentProject}/upload`, { method: 'POST', body: fd });
      addMsg('system', `uploaded ${f.name}`);
    } catch (e) { addMsg('system', '⚠ ' + e.message); }
  }
  loadFiles();
}

document.getElementById('fileinput').addEventListener('change', e => {
  uploadFiles([...e.target.files]);
  e.target.value = '';  // allow re-uploading the same file
});

function renderHistory(messages) {
  chat.innerHTML = '';
  for (const m of messages) {
    if (m.role === 'user') {
      const c = typeof m.content === 'string' ? m.content
              : (m.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
      if (c) addMsg('user', c);
    } else if (m.role === 'assistant') {
      (m.content || []).forEach(block => {
        if (block.type === 'text' && block.text) addMsg('assistant', block.text);
        else if (block.type === 'image') addImages([block]);
        else if (block.type === 'toolCall') addTool(block.name, 'done');
        // thinking blocks are skipped in the history view
      });
    } else if (m.role === 'toolResult') {
      addImages(m.content);  // e.g. images produced by the read tool
    }
  }
  chat.scrollTop = chat.scrollHeight;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => {
    dot.classList.add('on'); statusEl.textContent = 'connected';
    loadProjects();
    // Rehydrate chat history from pi's session.
    ws.send(JSON.stringify({ type: 'get_messages' }));
  };
  ws.onclose = () => { dot.classList.remove('on'); statusEl.textContent = 'disconnected'; setTimeout(connect, 1500); };
  ws.onerror = () => { try { ws.close(); } catch(e){} };
  ws.onmessage = (ev) => {
    let rec; try { rec = JSON.parse(ev.data); } catch(e) { return; }
    handle(rec);
  };
}

function handle(rec) {
  const t = rec.type;
  if (t === 'message_update' && rec.assistantMessageEvent) {
    const ev = rec.assistantMessageEvent;
    if (ev.type === 'text_start') {
      currentAssistant = addMsg('assistant', '', true);
      streaming = true;
    } else if (ev.type === 'text_delta' && currentAssistant) {
      currentAssistant._raw = (currentAssistant._raw || '') + ev.delta;
      currentAssistant.innerHTML = renderMd(currentAssistant._raw);
      chat.scrollTop = chat.scrollHeight;
    } else if (ev.type === 'text_end' && currentAssistant) {
      currentAssistant.innerHTML = renderMd(ev.content != null ? ev.content : (currentAssistant._raw || ''));
    }
  } else if (t === 'tool_execution_start') {
    currentTool = addTool(rec.toolName, 'running…');
  } else if (t === 'tool_execution_end' && currentTool) {
    currentTool.innerHTML = `<span class="tname">${escapeHtml(rec.toolName)}</span> · ${rec.isError ? 'error' : 'done'}`;
    addImages(rec.result && rec.result.content);  // surface images (read tool)
  } else if (t === 'agent_settled') {
    streaming = false; currentAssistant = null; currentTool = null; loadFiles();
  } else if (t === 'response') {
    if (rec.command === 'prompt' && rec.success === false) {
      addMsg('system', '⚠ prompt not accepted');
    } else if (rec.command === 'get_messages' && rec.success && rec.data) {
      renderHistory(rec.data.messages || []);
      loadFiles();
    }
  } else if (t === 'harness') {
    if (rec.event === 'pi_restarted') addMsg('system', 'pi restarted, history reloaded');
    if (rec.event === 'activated') { currentProject = rec.project; loadProjects(); loadFiles(); }
  } else if (t === 'error') {
    addMsg('system', '⚠ ' + rec.message);
  }
}
let currentAssistant = null, currentTool = null;

function send() {
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  input.value = ''; input.style.height = 'auto';
  if (text === '/stop') {
    ws.send(JSON.stringify({ type: 'abort' }));
    addMsg('system', 'aborted');
    streaming = false;
    return;
  }
  addMsg('user', text);
  ws.send(JSON.stringify({ type: 'prompt', message: text }));
  streaming = true;
}

sendBtn.onclick = send;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; });

projectSel.onchange = async () => {
  const name = projectSel.value;
  chat.innerHTML = '';
  await api(`/api/projects/${name}/activate`, { method: 'POST' });
  currentProject = name;
  addMsg('system', `switched to project "${name}"`);
  loadProjects(); loadFiles();
  // Reload this project's history from pi.
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'get_messages' }));
};

document.getElementById('delproj').onclick = async () => {
  const name = currentProject;
  if (!name) return;
  if (!confirm(`Delete workspace "${name}"? Its files and chat history will be removed.`)) return;
  try {
    await api(`/api/projects/${DEFAULT_PROJECT}/activate`, { method: 'POST' });
    await api(`/api/projects/${name}`, { method: 'DELETE' });
    chat.innerHTML = '';
    currentProject = DEFAULT_PROJECT;
    addMsg('system', `deleted workspace "${name}"`);
    loadProjects(); loadFiles();
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'get_messages' }));
  } catch (e) { alert(e.message); }
};

document.getElementById('newproj').onclick = async () => {
  const name = prompt('Project name:');
  if (!name) return;
  try {
    await api('/api/projects', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
    await api(`/api/projects/${name}/activate`, { method: 'POST' });
    chat.innerHTML = ''; currentProject = name;
    addMsg('system', `created project "${name}"`);
    loadProjects(); loadFiles();
  } catch (e) { alert(e.message); }
};

document.getElementById('filesbtn').onclick = () => { filesPanel.classList.toggle('show'); loadFiles(); };
</script>
</body>
</html>
