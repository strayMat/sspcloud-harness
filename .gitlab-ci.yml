# Build the harness image and push it to DockerHub.
# Mirrors the Dockerize workflow from InseeFrLab/template-shiny-app:
#   - push to main -> image tagged :latest
#   - push a tag   -> image tagged with the tag name
#   - login to DockerHub with DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
#
# Secrets come from the Onyxia vault secret SSPCLOUD_HARNESS, copied into
# GitLab project CI/CD variables (Settings -> CI/CD -> Variables, masked).
#
# No dind: this runner cannot start a docker daemon as a service (dind
# failed with "Cannot connect to the Docker daemon at tcp://docker:2375").
# The job relies on the runner's own docker daemon (socket mounted or
# shell executor).

stages:
  - build

build:
  stage: build
  image: docker:27
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    IMAGE: "$DOCKERHUB_USERNAME/sspcloud-harness"
    DH_USER: "$DOCKERHUB_USERNAME"
    DH_TOKEN: "$DOCKERHUB_TOKEN"
  script:
    - TAG=${CI_COMMIT_TAG:-latest}
    - echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
    - docker build -t "$IMAGE:$TAG" .
    - docker push "$IMAGE:$TAG"
